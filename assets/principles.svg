<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="border-glow-p" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="p-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');
      
      .p-title {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 15px;
        fill: #FFFFFF;
      }

      .p-desc {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 12px;
        fill: #94A3B8;
        line-height: 1.5;
      }
    </style>
  </defs>

  <rect width="920" height="240" rx="16" fill="url(#p-bg)"/>

  <!-- 2x2 Grid Layout -->

  <!-- Panel 1: Scalability First -->
  <g transform="translate(20, 20)">
    <rect width="430" height="92" rx="10" fill="url(#card-glass)" stroke="url(#border-glow-p)" stroke-width="1.2"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#2563EB" fill-opacity="0.2"/>
      <text x="11" y="22" font-family="'Inter', sans-serif" font-size="16">⚡</text>
      
      <text x="44" y="16" class="p-title">Scalability First</text>
      <text x="44" y="36" class="p-desc">Designing systems for exponential load, stateless microservices,</text>
      <text x="44" y="52" class="p-desc">intelligent caching, and sub-50ms p99 latency targets.</text>
    </g>
  </g>

  <!-- Panel 2: Systems Thinking -->
  <g transform="translate(470, 20)">
    <rect width="430" height="92" rx="10" fill="url(#card-glass)" stroke="url(#border-glow-p)" stroke-width="1.2"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#8B5CF6" fill-opacity="0.2"/>
      <text x="11" y="22" font-family="'Inter', sans-serif" font-size="16">🧠</text>

      <text x="44" y="16" class="p-title">Systems Thinking</text>
      <text x="44" y="36" class="p-desc">Holistic engineering across AI model orchestration, distributed</text>
      <text x="44" y="52" class="p-desc">event buses, database isolation, and client render loops.</text>
    </g>
  </g>

  <!-- Panel 3: Clean Architecture -->
  <g transform="translate(20, 128)">
    <rect width="430" height="92" rx="10" fill="url(#card-glass)" stroke="url(#border-glow-p)" stroke-width="1.2"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="11" y="22" font-family="'Inter', sans-serif" font-size="16">🛡️</text>

      <text x="44" y="16" class="p-title">Clean Architecture</text>
      <text x="44" y="36" class="p-desc">Strict type-safety, domain-driven boundaries, comprehensive</text>
      <text x="44" y="52" class="p-desc">automated test suites, and defensive runtime patterns.</text>
    </g>
  </g>

  <!-- Panel 4: Velocity & Precision -->
  <g transform="translate(470, 128)">
    <rect width="430" height="92" rx="10" fill="url(#card-glass)" stroke="url(#border-glow-p)" stroke-width="1.2"/>
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="#10B981" fill-opacity="0.2"/>
      <text x="11" y="22" font-family="'Inter', sans-serif" font-size="16">🚀</text>

      <text x="44" y="16" class="p-title">Velocity &amp; Precision</text>
      <text x="44" y="36" class="p-desc">Fast iterative delivery backed by GitOps, zero-downtime</text>
      <text x="44" y="52" class="p-desc">deployments, structured telemetry, and automated CI/CD.</text>
    </g>
  </g>

  <rect width="920" height="240" rx="16" fill="none" stroke="url(#border-glow-p)" stroke-width="1.5"/>
</svg>
