<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0B0E28"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="border-glow-ph" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#B026FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="purple-spot" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>

    <style>
      .hdr-main {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 13px;
        fill: #FFFFFF;
        letter-spacing: 1.5px;
      }
      .quote-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-style: italic;
        font-size: 16px;
        fill: #F8FAFC;
        line-height: 1.5;
      }
      .author {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #00F0FF;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <rect width="920" height="180" rx="16" fill="url(#ph-bg)"/>
  <rect width="920" height="180" rx="16" fill="url(#purple-spot)"/>

  <!-- Top Title -->
  <circle cx="30" cy="25" r="4" fill="#00F0FF"/>
  <text x="44" y="29" class="hdr-main">ENGINEERING PHILOSOPHY &amp; CORE BELIEF</text>

  <!-- Large Decorative Quotation Mark -->
  <text x="35" y="105" font-family="serif" font-size="80" fill="#B026FF" fill-opacity="0.15">“</text>

  <!-- Quote Lines -->
  <text x="65" y="78" class="quote-txt">
    “Simplicity is prerequisite for reliability. Software engineering is not about writing code —
  </text>
  <text x="65" y="104" class="quote-txt">
    it is about controlling complexity through system architecture.”
  </text>

  <!-- Author Attribution -->
  <text x="65" y="145" class="author">— ESHWAR J <tspan fill="#64748B" font-weight="400">(@eshwar187)</tspan></text>

  <!-- Outer Glow Frame -->
  <rect width="920" height="180" rx="16" fill="none" stroke="url(#border-glow-ph)" stroke-width="1.5"/>
</svg>
