<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="ph-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&amp;family=Inter:ital,wght@0,600;0,800;1,400&amp;display=swap');

      .quote {
        font-family: 'Inter', sans-serif;
        font-style: italic;
        font-size: 15px;
        fill: #E2E8F0;
      }

      .author {
        font-family: 'Fira Code', monospace;
        font-size: 12px;
        fill: #38BDF8;
      }

      .pillar-title {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 13px;
        fill: #FFFFFF;
      }

      .pillar-sub {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <rect width="920" height="180" rx="16" fill="url(#ph-bg)"/>

  <!-- Top Quote Banner -->
  <g transform="translate(460, 42)" text-anchor="middle">
    <text class="quote">“Simplicity is prerequisite for reliability. Complex systems evolve from simple systems that worked.”</text>
    <text y="24" class="author">— Edsger W. Dijkstra • System Architecture Principle</text>
  </g>

  <line x1="60" y1="90" x2="860" y2="90" stroke="#1E293B" stroke-width="1"/>

  <!-- 3 Pillar Columns -->
  <g transform="translate(0, 105)">
    <!-- Column 1 -->
    <g transform="translate(60, 0)">
      <circle cx="12" cy="14" r="5" fill="#38BDF8"/>
      <text x="26" y="18" class="pillar-title">🧱 Modularity</text>
      <text x="26" y="36" class="pillar-sub">Decoupled systems with explicit boundaries</text>
      <text x="26" y="50" class="pillar-sub">minimize cognitive load and blast radius.</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(340, 0)">
      <circle cx="12" cy="14" r="5" fill="#8B5CF6"/>
      <text x="26" y="18" class="pillar-title">🚀 Observability</text>
      <text x="26" y="36" class="pillar-sub">Structured telemetry and metrics enable</text>
      <text x="26" y="50" class="pillar-sub">immediate operational diagnostics.</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(620, 0)">
      <circle cx="12" cy="14" r="5" fill="#10B981"/>
      <text x="26" y="18" class="pillar-title">⚡ Automation</text>
      <text x="26" y="36" class="pillar-sub">Automate build, test, and release flows</text>
      <text x="26" y="50" class="pillar-sub">for zero-downtime reliability.</text>
    </g>
  </g>

  <rect width="920" height="180" rx="16" fill="none" stroke="url(#ph-border)" stroke-width="1.5"/>
</svg>
