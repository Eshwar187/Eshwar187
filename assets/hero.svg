<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Neon Radial Glows -->
    <radialGradient id="glow-primary" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-secondary" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="glass-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 46px;
        fill: url(#text-gradient);
        letter-spacing: -1px;
      }
      
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }

      .badge-text {
        font-family: monospace, 'Courier New', Courier;
        font-weight: 700;
        font-size: 11px;
        fill: #38BDF8;
      }

      .code-font {
        font-family: monospace, 'Courier New', Courier;
        font-size: 12px;
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.6; }
      }

      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .animated-glow-1 { animation: pulseGlow 8s ease-in-out infinite; }
      .floating-1 { animation: floatCard1 6s ease-in-out infinite; }
      .cursor { animation: cursorBlink 1s step-start infinite; fill: #38BDF8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="920" height="460" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Glowing Background Orbs -->
  <rect width="920" height="460" rx="16" fill="url(#glow-primary)" class="animated-glow-1"/>
  <rect width="920" height="460" rx="16" fill="url(#glow-secondary)"/>
  <rect width="920" height="460" rx="16" fill="url(#glow-cyan)"/>

  <!-- Grid Overlay -->
  <rect width="920" height="460" rx="16" fill="url(#grid-pattern)"/>

  <!-- Left Hero Panel: Identity & Typography -->
  <g transform="translate(48, 55)">

    <!-- Status Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="30" rx="15" fill="#0F172A" fill-opacity="0.9" stroke="url(#border-gradient)" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#10B981" filter="url(#subtle-glow)"/>
      <text x="28" y="19" class="badge-text">AVAILABLE FOR OPPORTUNITIES</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title">ESHWAR J</text>
    
    <!-- Subtitle / Roles -->
    <text x="0" y="118" class="subtitle">FULL STACK • AI ENGINEER • CLOUD</text>

    <!-- Mission Statement / Tagline (Explicit line positioning to prevent overlap) -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#94A3B8" font-weight="400">Building high-performance distributed systems &amp; intelligent applications.</text>
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#64748B" font-weight="400">Architecting cloud infrastructure with modern TypeScript, Go, &amp; Python.</text>

    <!-- Action Tags / Tech Badges (Minimal Chips) -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="115" height="28" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="monospace" font-size="11" fill="#38BDF8">⚡ Distributed</text>

      <rect x="125" y="0" width="100" height="28" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="137" y="18" font-family="monospace" font-size="11" fill="#8B5CF6">🧠 AI/LLMs</text>

      <rect x="235" y="0" width="110" height="28" rx="6" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="247" y="18" font-family="monospace" font-size="11" fill="#60A5FA">☁️ Cloud Native</text>
    </g>

    <!-- Key Focus Pillars Strip -->
    <g transform="translate(0, 265)">
      <rect width="360" height="60" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-gradient)" stroke-width="1"/>
      
      <g transform="translate(16, 16)">
        <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">High Scale</text>
        <text x="0" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.5">ARCHITECTURE</text>
      </g>

      <line x1="120" y1="12" x2="120" y2="48" stroke="#334155" stroke-width="1"/>

      <g transform="translate(136, 16)">
        <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#38BDF8">Fast Edge</text>
        <text x="0" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.5">PERFORMANCE</text>
      </g>

      <line x1="240" y1="12" x2="240" y2="48" stroke="#334155" stroke-width="1"/>

      <g transform="translate(256, 16)">
        <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#8B5CF6">Production</text>
        <text x="0" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.5">READY CODE</text>
      </g>
    </g>
  </g>

  <!-- Right Hero Panel: Interactive Glass Terminal (Explicit positions for code text) -->
  <g transform="translate(460, 50)">

    <!-- Main Glass Terminal Window -->
    <g class="floating-1">
      <rect width="410" height="270" rx="12" fill="#000000" fill-opacity="0.4" y="8" filter="url(#blur-glow)"/>
      <rect width="410" height="270" rx="12" fill="url(#glass-card-bg)" stroke="url(#border-gradient)" stroke-width="1.2"/>

      <!-- Terminal Title Bar -->
      <rect width="410" height="36" rx="12" fill="#0F172A" fill-opacity="0.9"/>
      <circle cx="20" cy="18" r="5.5" fill="#EF4444"/>
      <circle cx="36" cy="18" r="5.5" fill="#F59E0B"/>
      <circle cx="52" cy="18" r="5.5" fill="#10B981"/>

      <text x="205" y="22" font-family="monospace" font-size="11" fill="#64748B" text-anchor="middle">developer.ts — eshwar187</text>
      <line x1="0" y1="36" x2="410" y2="36" stroke="#1E293B" stroke-width="1"/>

      <!-- Code Lines with EXPLICIT Y COORDINATES (Prevents text overlap!) -->
      <g transform="translate(20, 55)" class="code-font">
        <text x="0" y="16" fill="#64748B">// Senior Full Stack &amp; AI Engineer</text>
        <text x="0" y="38" fill="#F472B6">class <tspan fill="#38BDF8">Engineer</tspan> <tspan fill="#F472B6">implements</tspan> <tspan fill="#FBBF24">Architect</tspan> {</text>
        <text x="0" y="60" fill="#94A3B8">  readonly name = <tspan fill="#A3E635">'Eshwar J'</tspan>;</text>
        <text x="0" y="82" fill="#94A3B8">  readonly stack = [<tspan fill="#A3E635">'TypeScript'</tspan>, <tspan fill="#A3E635">'Go'</tspan>, <tspan fill="#A3E635">'Python'</tspan>];</text>
        <text x="0" y="104" fill="#94A3B8">  public async <tspan fill="#60A5FA">shipNextGenApp</tspan>() {</text>
        <text x="0" y="126" fill="#94A3B8">    const sys = new <tspan fill="#38BDF8">AICloudSystem</tspan>({</text>
        <text x="0" y="146" fill="#94A3B8">      reliability: <tspan fill="#F59E0B">0.9999</tspan>,</text>
        <text x="0" y="166" fill="#94A3B8">      scale: <tspan fill="#A3E635">'global'</tspan></text>
        <text x="0" y="186" fill="#94A3B8">    });</text>
        <text x="0" y="208" fill="#94A3B8">    return await sys.<tspan fill="#60A5FA">deploy</tspan>();<tspan class="cursor">█</tspan></text>
        <text x="0" y="226" fill="#F472B6">  }</text>
        <text x="0" y="244" fill="#F472B6">}</text>
      </g>
    </g>

  </g>

  <!-- Outer Border Frame -->
  <rect width="920" height="460" rx="16" fill="none" stroke="url(#border-gradient)" stroke-width="1.5"/>
</svg>
