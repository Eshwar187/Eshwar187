<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Neon Glow Orbs -->
    <radialGradient id="neon-cyan" cx="20%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="neon-purple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Glass Frame Gradient -->
    <linearGradient id="glass-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Cyberpunk Grid -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.2" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>

    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .cyber-sub {
        font-family: monospace, 'Courier New', Courier;
        font-weight: 700;
        font-size: 13px;
        fill: #38BDF8;
        letter-spacing: 2px;
      }

      .main-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 58px;
        fill: url(#title-grad);
        letter-spacing: -1.5px;
      }

      .role-tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }

      .hero-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        fill: #E2E8F0;
      }

      .term-text {
        font-family: monospace, 'Courier New', Courier;
        font-size: 13px;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      .cursor { animation: blink 1s step-start infinite; fill: #38BDF8; }
      .float-anim { animation: floatCard 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="460" rx="16" fill="url(#bg-cyber)"/>
  <rect width="920" height="460" rx="16" fill="url(#neon-cyan)"/>
  <rect width="920" height="460" rx="16" fill="url(#neon-purple)"/>
  <rect width="920" height="460" rx="16" fill="url(#cyber-grid)"/>

  <!-- Left Main Content Area -->
  <g transform="translate(48, 50)">

    <!-- Top Tagline -->
    <text x="0" y="24" class="cyber-sub">&gt;_ FULL STACK DEVELOPER</text>

    <!-- Huge Typography Name -->
    <text x="0" y="85" class="main-name">ESHWAR J</text>

    <!-- Subheader Roles -->
    <text x="0" y="118" class="role-tag">AI ENGINEER  |  CLOUD NATIVE BUILDER  |  PROBLEM SOLVER</text>

    <!-- Tagline Text (Explicit Absolute Lines) -->
    <text x="0" y="160" class="hero-desc" font-weight="400">
      Building software that <tspan fill="#38BDF8" font-weight="700">scales</tspan>.
    </text>
    <text x="0" y="186" class="hero-desc" font-weight="400">
      Designing <tspan fill="#8B5CF6" font-weight="700">intelligent</tspan> systems.
    </text>

    <!-- Tech Pillar Chips Row (6 Chips) -->
    <g transform="translate(0, 220)">
      <!-- 1. Code -->
      <rect x="0" y="0" width="62" height="45" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="31" y="20" font-family="sans-serif" font-size="14" text-anchor="middle">&lt;/&gt;</text>
      <text x="31" y="36" font-family="sans-serif" font-size="9" fill="#94A3B8" font-weight="700" text-anchor="middle">CODE</text>

      <!-- 2. Cloud -->
      <rect x="72" y="0" width="62" height="45" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="103" y="20" font-family="sans-serif" font-size="14" text-anchor="middle">☁️</text>
      <text x="103" y="36" font-family="sans-serif" font-size="9" fill="#94A3B8" font-weight="700" text-anchor="middle">CLOUD</text>

      <!-- 3. AI -->
      <rect x="144" y="0" width="62" height="45" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="175" y="20" font-family="sans-serif" font-size="14" text-anchor="middle">🧠</text>
      <text x="175" y="36" font-family="sans-serif" font-size="9" fill="#94A3B8" font-weight="700" text-anchor="middle">AI</text>

      <!-- 4. Data -->
      <rect x="216" y="0" width="62" height="45" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="247" y="20" font-family="sans-serif" font-size="14" text-anchor="middle">🗄️</text>
      <text x="247" y="36" font-family="sans-serif" font-size="9" fill="#94A3B8" font-weight="700" text-anchor="middle">DATA</text>

      <!-- 5. Deploy -->
      <rect x="288" y="0" width="62" height="45" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="319" y="20" font-family="sans-serif" font-size="14" text-anchor="middle">🚀</text>
      <text x="319" y="36" font-family="sans-serif" font-size="9" fill="#94A3B8" font-weight="700" text-anchor="middle">DEPLOY</text>
    </g>

  </g>

  <!-- Center Feature Cards Column (Image 3 Style) -->
  <g transform="translate(460, 48)">

    <!-- Card 1: BUILD -->
    <g transform="translate(0, 0)">
      <rect width="180" height="75" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
      <circle cx="28" cy="37" r="14" fill="#2563EB" fill-opacity="0.2"/>
      <text x="22" y="42" font-family="sans-serif" font-size="14" fill="#38BDF8">&lt;/&gt;</text>
      <text x="52" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">BUILD</text>
      <text x="52" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Clean Code</text>
      <text x="52" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Better Future</text>
    </g>

    <!-- Card 2: DESIGN -->
    <g transform="translate(0, 88)">
      <rect width="180" height="75" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
      <circle cx="28" cy="37" r="14" fill="#8B5CF6" fill-opacity="0.2"/>
      <text x="22" y="42" font-family="sans-serif" font-size="14" fill="#8B5CF6">🧊</text>
      <text x="52" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">DESIGN</text>
      <text x="52" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Scalable</text>
      <text x="52" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Architecture</text>
    </g>

    <!-- Card 3: INTELLIGENCE -->
    <g transform="translate(0, 176)">
      <rect width="180" height="75" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
      <circle cx="28" cy="37" r="14" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="22" y="42" font-family="sans-serif" font-size="14" fill="#38BDF8">🧠</text>
      <text x="52" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">INTELLIGENCE</text>
      <text x="52" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">AI-Powered</text>
      <text x="52" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Solutions</text>
    </g>

    <!-- Card 4: DEPLOY -->
    <g transform="translate(0, 264)">
      <rect width="180" height="75" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
      <circle cx="28" cy="37" r="14" fill="#10B981" fill-opacity="0.2"/>
      <text x="22" y="42" font-family="sans-serif" font-size="14" fill="#10B981">☁️</text>
      <text x="52" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">DEPLOY</text>
      <text x="52" y="48" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Cloud Native</text>
      <text x="52" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Everywhere</text>
    </g>

  </g>

  <!-- Right Side Terminal Window (Image 3 Style) -->
  <g transform="translate(660, 48)" class="float-anim">
    <rect width="210" height="340" rx="12" fill="#090D16" fill-opacity="0.9" stroke="url(#border-glow)" stroke-width="1.2" filter="url(#subtle-glow)"/>

    <!-- Title Bar -->
    <rect width="210" height="36" rx="12" fill="#0F172A"/>
    <circle cx="16" cy="18" r="5" fill="#EF4444"/>
    <circle cx="30" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="44" cy="18" r="5" fill="#10B981"/>

    <text x="125" y="22" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">TERMINAL</text>
    <line x1="0" y1="36" x2="210" y2="36" stroke="#1E293B" stroke-width="1"/>

    <!-- Terminal Content (Image 3 Style) -->
    <g transform="translate(18, 55)" class="term-text">
      <text x="0" y="24" fill="#38BDF8">&gt; Code.</text>
      <text x="0" y="56" fill="#60A5FA">&gt; Build.</text>
      <text x="0" y="88" fill="#8B5CF6">&gt; Ship.</text>
      <text x="0" y="120" fill="#34D399">&gt; Repeat.</text>
      <text x="0" y="152" fill="#94A3B8">&gt; <tspan class="cursor">_</tspan></text>
    </g>

    <!-- Mini Activity Frequency Bar Graph inside Terminal -->
    <g transform="translate(18, 260)">
      <rect x="0" y="16" width="10" height="24" rx="2" fill="#2563EB"/>
      <rect x="15" y="8" width="10" height="32" rx="2" fill="#38BDF8"/>
      <rect x="30" y="0" width="10" height="40" rx="2" fill="#8B5CF6"/>
      <rect x="45" y="12" width="10" height="28" rx="2" fill="#38BDF8"/>
      <rect x="60" y="-8" width="10" height="48" rx="2" fill="#10B981"/>
      <rect x="75" y="4" width="10" height="36" rx="2" fill="#60A5FA"/>
      <rect x="90" y="16" width="10" height="24" rx="2" fill="#2563EB"/>
      <text x="0" y="54" font-family="monospace" font-size="9" fill="#64748B">System Velocity</text>
    </g>
  </g>

  <!-- Outer Frame -->
  <rect width="920" height="460" rx="16" fill="none" stroke="url(#border-glow)" stroke-width="1.5"/>
</svg>
