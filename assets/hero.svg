<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0B0E28"/>
      <stop offset="100%" stop-color="#1A0B2E"/>
    </linearGradient>

    <!-- Neon Glow Orbs -->
    <radialGradient id="neon-cyan" cx="15%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="neon-purple" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>

    <!-- Glass Frame Gradient -->
    <linearGradient id="glass-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stroke-opacity="0.7"/>
      <stop offset="50%" stop-color="#B026FF" stroke-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stroke-opacity="0.2"/>
    </linearGradient>

    <!-- Cyberpunk Grid -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.2" fill="#00F0FF" fill-opacity="0.3"/>
    </pattern>

    <style>
      .cyber-sub {
        font-family: monospace, 'Courier New', Courier;
        font-weight: 700;
        font-size: 11px;
        fill: #00F0FF;
        letter-spacing: 2px;
      }

      .main-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 48px;
        fill: url(#title-grad);
        letter-spacing: -1px;
      }

      .role-tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #94A3B8;
        letter-spacing: 1.5px;
      }

      .hero-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        fill: #E2E8F0;
      }

      .term-text {
        font-family: monospace, 'Courier New', Courier;
        font-size: 11px;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .cursor { animation: blink 1s step-start infinite; fill: #00F0FF; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="360" rx="16" fill="url(#bg-cyber)"/>
  <rect width="1000" height="360" rx="16" fill="url(#neon-cyan)"/>
  <rect width="1000" height="360" rx="16" fill="url(#neon-purple)"/>
  <rect width="1000" height="360" rx="16" fill="url(#cyber-grid)"/>

  <!-- Left Main Content Area -->
  <text x="40" y="38" class="cyber-sub">&gt;_ FULL STACK DEVELOPER</text>
  <text x="40" y="85" class="main-name">ESHWAR J</text>
  <text x="40" y="112" class="role-tag">AI ENGINEER  |  CLOUD NATIVE BUILDER  |  PROBLEM SOLVER</text>

  <!-- Tagline Text -->
  <text x="40" y="145" class="hero-desc">
    Building software that <tspan fill="#00F0FF" font-weight="700">scales</tspan>. Designing <tspan fill="#B026FF" font-weight="700">intelligent</tspan> systems.
  </text>

  <!-- 6 Icon Chips Row (Absolute X: 40 to 425, Y: 175) -->
  <g transform="translate(40, 175)">
    <!-- Chip 1: CODE -->
    <rect x="0" y="0" width="55" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="27" y="19" font-family="sans-serif" font-size="12" fill="#00F0FF" text-anchor="middle">&lt;/&gt;</text>
    <text x="27" y="33" font-family="sans-serif" font-size="7" fill="#94A3B8" font-weight="700" text-anchor="middle">CODE</text>

    <!-- Chip 2: CLOUD -->
    <rect x="62" y="0" width="55" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="89" y="19" font-family="sans-serif" font-size="12" text-anchor="middle">☁️</text>
    <text x="89" y="33" font-family="sans-serif" font-size="7" fill="#94A3B8" font-weight="700" text-anchor="middle">CLOUD</text>

    <!-- Chip 3: AI -->
    <rect x="124" y="0" width="55" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="151" y="19" font-family="sans-serif" font-size="12" text-anchor="middle">🧠</text>
    <text x="151" y="33" font-family="sans-serif" font-size="7" fill="#94A3B8" font-weight="700" text-anchor="middle">AI</text>

    <!-- Chip 4: DATA -->
    <rect x="186" y="0" width="55" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="213" y="19" font-family="sans-serif" font-size="12" text-anchor="middle">🗄️</text>
    <text x="213" y="33" font-family="sans-serif" font-size="7" fill="#94A3B8" font-weight="700" text-anchor="middle">DATA</text>

    <!-- Chip 5: DEPLOY -->
    <rect x="248" y="0" width="55" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="275" y="19" font-family="sans-serif" font-size="12" text-anchor="middle">🚀</text>
    <text x="275" y="33" font-family="sans-serif" font-size="7" fill="#94A3B8" font-weight="700" text-anchor="middle">DEPLOY</text>

    <!-- Chip 6: AUTOMATE -->
    <rect x="310" y="0" width="60" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="340" y="19" font-family="sans-serif" font-size="12" text-anchor="middle">⚙️</text>
    <text x="340" y="33" font-family="sans-serif" font-size="7" fill="#94A3B8" font-weight="700" text-anchor="middle">AUTOMATE</text>
  </g>

  <!-- Middle Column: 4 Floating Feature Cards (Absolute X: 470) -->
  <!-- Card 1: BUILD -->
  <rect x="470" y="28" width="150" height="42" rx="8" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
  <circle cx="490" cy="49" r="10" fill="#2563EB" fill-opacity="0.2"/>
  <text x="485" y="52" font-family="sans-serif" font-size="10" fill="#00F0FF">&lt;/&gt;</text>
  <text x="510" y="46" font-family="-apple-system, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">BUILD</text>
  <text x="510" y="58" font-family="-apple-system, sans-serif" font-size="8" fill="#94A3B8">Clean Code</text>

  <!-- Card 2: DESIGN -->
  <rect x="470" y="78" width="150" height="42" rx="8" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
  <circle cx="490" cy="99" r="10" fill="#B026FF" fill-opacity="0.2"/>
  <text x="485" y="102" font-family="sans-serif" font-size="10" fill="#B026FF">🧊</text>
  <text x="510" y="96" font-family="-apple-system, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">DESIGN</text>
  <text x="510" y="108" font-family="-apple-system, sans-serif" font-size="8" fill="#94A3B8">Scalable Architecture</text>

  <!-- Card 3: INTELLIGENCE -->
  <rect x="470" y="128" width="150" height="42" rx="8" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
  <circle cx="490" cy="149" r="10" fill="#00F0FF" fill-opacity="0.2"/>
  <text x="485" y="152" font-family="sans-serif" font-size="10" fill="#00F0FF">🧠</text>
  <text x="510" y="146" font-family="-apple-system, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">INTELLIGENCE</text>
  <text x="510" y="158" font-family="-apple-system, sans-serif" font-size="8" fill="#94A3B8">AI-Powered Solutions</text>

  <!-- Card 4: DEPLOY -->
  <rect x="470" y="178" width="150" height="42" rx="8" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
  <circle cx="490" cy="199" r="10" fill="#10B981" fill-opacity="0.2"/>
  <text x="485" y="202" font-family="sans-serif" font-size="10" fill="#10B981">☁️</text>
  <text x="510" y="196" font-family="-apple-system, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">DEPLOY</text>
  <text x="510" y="208" font-family="-apple-system, sans-serif" font-size="8" fill="#94A3B8">Cloud Native</text>

  <!-- Right Column: Terminal Window (Absolute X: 645) -->
  <rect x="645" y="28" width="170" height="192" rx="10" fill="#090D16" fill-opacity="0.95" stroke="url(#border-glow)" stroke-width="1.2"/>
  <rect x="645" y="28" width="170" height="26" rx="10" fill="#0F172A"/>
  <circle cx="803" cy="41" r="3.5" fill="#10B981"/>
  <circle cx="793" cy="41" r="3.5" fill="#F59E0B"/>
  <circle cx="783" cy="41" r="3.5" fill="#EF4444"/>
  <text x="700" y="45" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">TERMINAL</text>

  <line x1="645" y1="54" x2="815" y2="54" stroke="#1E293B" stroke-width="1"/>

  <!-- Terminal Content Lines (Absolute X: 660) -->
  <text x="660" y="80" class="term-text" fill="#00F0FF">&gt; Code.</text>
  <text x="660" y="102" class="term-text" fill="#60A5FA">&gt; Build.</text>
  <text x="660" y="124" class="term-text" fill="#B026FF">&gt; Ship.</text>
  <text x="660" y="146" class="term-text" fill="#34D399">&gt; Repeat.</text>
  <text x="660" y="168" class="term-text" fill="#94A3B8">&gt; <tspan class="cursor">_</tspan></text>

  <!-- Bottom Glass Metrics Bar (REAL DATA FOR ESHWAR187: X: 40, Y: 260, Width: 920, Height: 68) -->
  <rect x="40" y="260" width="920" height="68" rx="12" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1.2"/>

  <!-- Stat 1: Public Repositories (REAL 120 REPOS) -->
  <text x="80" y="292" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">120</text>
  <text x="80" y="310" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Public Repos</text>

  <!-- Stat 2: Primary Tech (TypeScript & JS) -->
  <text x="260" y="292" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#00F0FF">TS &amp; JS</text>
  <text x="260" y="310" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Primary Stack</text>

  <!-- Stat 3: Member Since -->
  <text x="440" y="292" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#B026FF">May 2023</text>
  <text x="440" y="310" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">GitHub Member</text>

  <!-- Stat 4: Bio Focus -->
  <text x="620" y="292" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#34D399">SaaS &amp; AI</text>
  <text x="620" y="310" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Systems Builder</text>

  <!-- Stat 5: Verified Account -->
  <text x="800" y="292" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#60A5FA">Verified</text>
  <text x="800" y="310" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">@eshwar187</text>

  <!-- Outer Frame -->
  <rect width="1000" height="360" rx="16" fill="none" stroke="url(#border-glow)" stroke-width="1.5"/>
</svg>
