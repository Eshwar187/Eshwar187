<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0B0E28"/>
      <stop offset="100%" stop-color="#1A0B2E"/>
    </linearGradient>

    <!-- Neon Glow Orbs -->
    <radialGradient id="neon-cyan" cx="15%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="neon-purple" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>

    <!-- Glass Frame Gradient -->
    <linearGradient id="glass-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stroke-opacity="0.7"/>
      <stop offset="50%" stop-color="#B026FF" stroke-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stroke-opacity="0.2"/>
    </linearGradient>

    <!-- Cyberpunk Grid -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.2" fill="#00F0FF" fill-opacity="0.3"/>
    </pattern>

    <style>
      .cyber-sub {
        font-family: monospace, 'Courier New', Courier;
        font-weight: 700;
        font-size: 13px;
        fill: #00F0FF;
        letter-spacing: 2px;
      }

      .main-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: url(#title-grad);
        letter-spacing: -1.5px;
      }

      .role-tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #94A3B8;
        letter-spacing: 1.5px;
      }

      .hero-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        fill: #E2E8F0;
      }

      .term-text {
        font-family: monospace, 'Courier New', Courier;
        font-size: 13px;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .cursor { animation: blink 1s step-start infinite; fill: #00F0FF; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="500" rx="16" fill="url(#bg-cyber)"/>
  <rect width="1000" height="500" rx="16" fill="url(#neon-cyan)"/>
  <rect width="1000" height="500" rx="16" fill="url(#neon-purple)"/>
  <rect width="1000" height="500" rx="16" fill="url(#cyber-grid)"/>

  <!-- Left Main Content Area (Absolute X: 40) -->
  <text x="40" y="55" class="cyber-sub">&gt;_ FULL STACK DEVELOPER</text>
  <text x="40" y="115" class="main-name">ESHWAR J</text>
  <text x="40" y="150" class="role-tag">AI ENGINEER  |  CLOUD NATIVE BUILDER  |  PROBLEM SOLVER</text>

  <!-- Tagline Text -->
  <text x="40" y="195" class="hero-desc" font-weight="400">
    Building software that <tspan fill="#00F0FF" font-weight="700">scales</tspan>.
  </text>
  <text x="40" y="220" class="hero-desc" font-weight="400">
    Designing <tspan fill="#B026FF" font-weight="700">intelligent</tspan> systems.
  </text>

  <!-- 6 Icon Chips Row (Absolute X: 40 to 425) -->
  <!-- Chip 1: CODE -->
  <rect x="40" y="265" width="55" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="67" y="287" font-family="sans-serif" font-size="14" fill="#00F0FF" text-anchor="middle">&lt;/&gt;</text>
  <text x="67" y="303" font-family="sans-serif" font-size="8" fill="#94A3B8" font-weight="700" text-anchor="middle">CODE</text>

  <!-- Chip 2: CLOUD -->
  <rect x="105" y="265" width="55" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="132" y="287" font-family="sans-serif" font-size="14" text-anchor="middle">☁️</text>
  <text x="132" y="303" font-family="sans-serif" font-size="8" fill="#94A3B8" font-weight="700" text-anchor="middle">CLOUD</text>

  <!-- Chip 3: AI -->
  <rect x="170" y="265" width="55" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="197" y="287" font-family="sans-serif" font-size="14" text-anchor="middle">🧠</text>
  <text x="197" y="303" font-family="sans-serif" font-size="8" fill="#94A3B8" font-weight="700" text-anchor="middle">AI</text>

  <!-- Chip 4: DATA -->
  <rect x="235" y="265" width="55" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="262" y="287" font-family="sans-serif" font-size="14" text-anchor="middle">🗄️</text>
  <text x="262" y="303" font-family="sans-serif" font-size="8" fill="#94A3B8" font-weight="700" text-anchor="middle">DATA</text>

  <!-- Chip 5: DEPLOY -->
  <rect x="300" y="265" width="55" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="327" y="287" font-family="sans-serif" font-size="14" text-anchor="middle">🚀</text>
  <text x="327" y="303" font-family="sans-serif" font-size="8" fill="#94A3B8" font-weight="700" text-anchor="middle">DEPLOY</text>

  <!-- Chip 6: AUTOMATE -->
  <rect x="365" y="265" width="60" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="395" y="287" font-family="sans-serif" font-size="14" text-anchor="middle">⚙️</text>
  <text x="395" y="303" font-family="sans-serif" font-size="8" fill="#94A3B8" font-weight="700" text-anchor="middle">AUTOMATE</text>

  <!-- Middle Column: 4 Floating Feature Cards (Absolute X: 480) -->
  <!-- Card 1: BUILD -->
  <rect x="480" y="45" width="150" height="52" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
  <circle cx="504" cy="71" r="12" fill="#2563EB" fill-opacity="0.2"/>
  <text x="498" y="75" font-family="sans-serif" font-size="12" fill="#00F0FF">&lt;/&gt;</text>
  <text x="525" y="67" font-family="-apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">BUILD</text>
  <text x="525" y="81" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8">Clean Code Better Future</text>

  <!-- Card 2: DESIGN -->
  <rect x="480" y="110" width="150" height="52" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
  <circle cx="504" cy="136" r="12" fill="#B026FF" fill-opacity="0.2"/>
  <text x="498" y="140" font-family="sans-serif" font-size="12" fill="#B026FF">🧊</text>
  <text x="525" y="132" font-family="-apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">DESIGN</text>
  <text x="525" y="146" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8">Scalable Architecture</text>

  <!-- Card 3: INTELLIGENCE -->
  <rect x="480" y="175" width="150" height="52" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
  <circle cx="504" cy="201" r="12" fill="#00F0FF" fill-opacity="0.2"/>
  <text x="498" y="205" font-family="sans-serif" font-size="12" fill="#00F0FF">🧠</text>
  <text x="525" y="197" font-family="-apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">INTELLIGENCE</text>
  <text x="525" y="211" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8">AI-Powered Solutions</text>

  <!-- Card 4: DEPLOY -->
  <rect x="480" y="240" width="150" height="52" rx="10" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1"/>
  <circle cx="504" cy="266" r="12" fill="#10B981" fill-opacity="0.2"/>
  <text x="498" y="270" font-family="sans-serif" font-size="12" fill="#10B981">☁️</text>
  <text x="525" y="262" font-family="-apple-system, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">DEPLOY</text>
  <text x="525" y="276" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8">Cloud Native Everywhere</text>

  <!-- Right Column: Terminal Window (Absolute X: 660) -->
  <rect x="660" y="45" width="160" height="247" rx="10" fill="#090D16" fill-opacity="0.95" stroke="url(#border-glow)" stroke-width="1.2"/>
  <rect x="660" y="45" width="160" height="30" rx="10" fill="#0F172A"/>
  <circle cx="816" cy="60" r="4" fill="#10B981"/>
  <circle cx="806" cy="60" r="4" fill="#F59E0B"/>
  <circle cx="796" cy="60" r="4" fill="#EF4444"/>
  <text x="720" y="65" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">TERMINAL</text>

  <line x1="660" y1="75" x2="820" y2="75" stroke="#1E293B" stroke-width="1"/>

  <!-- Terminal Content Lines (Absolute X: 675) -->
  <text x="675" y="105" class="term-text" fill="#00F0FF">&gt; Code.</text>
  <text x="675" y="130" class="term-text" fill="#60A5FA">&gt; Build.</text>
  <text x="675" y="155" class="term-text" fill="#B026FF">&gt; Ship.</text>
  <text x="675" y="180" class="term-text" fill="#34D399">&gt; Repeat.</text>
  <text x="675" y="205" class="term-text" fill="#94A3B8">&gt; <tspan class="cursor">_</tspan></text>

  <!-- Bottom Glass Metrics Bar (REAL DATA FOR ESHWAR187: X: 210, Y: 380, Width: 750, Height: 75) -->
  <rect x="210" y="380" width="750" height="75" rx="14" fill="url(#glass-card-bg)" stroke="url(#border-glow)" stroke-width="1.2"/>

  <!-- Stat 1: Public Repositories (REAL 120 REPOS) -->
  <text x="250" y="415" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">120</text>
  <text x="250" y="433" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Public Repos</text>

  <!-- Stat 2: Primary Tech (TypeScript & JS) -->
  <text x="400" y="415" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#00F0FF">TS &amp; JS</text>
  <text x="400" y="433" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Primary Stack</text>

  <!-- Stat 3: Member Since -->
  <text x="550" y="415" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#B026FF">May 2023</text>
  <text x="550" y="433" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">GitHub Member</text>

  <!-- Stat 4: Bio Focus -->
  <text x="700" y="415" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#34D399">SaaS &amp; AI</text>
  <text x="700" y="433" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">Systems Builder</text>

  <!-- Stat 5: Verified Account -->
  <text x="830" y="415" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#60A5FA">Verified</text>
  <text x="830" y="433" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">@eshwar187</text>

  <!-- Outer Frame -->
  <rect width="1000" height="500" rx="16" fill="none" stroke="url(#border-glow)" stroke-width="1.5"/>
</svg>
