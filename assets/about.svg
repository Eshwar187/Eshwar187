<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <!-- Dark Glass Background Gradient -->
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Glass Card Fill -->
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Borders -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="cyan-glow" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <style>
      .hdr-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 15px;
        fill: #FFFFFF;
        letter-spacing: 1.5px;
      }
      .card-hdr {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 13px;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        fill: #94A3B8;
        line-height: 1.4;
      }

      @keyframes wavePulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }

      .wave-anim { animation: wavePulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect width="920" height="340" rx="16" fill="url(#about-bg)"/>
  <rect width="920" height="340" rx="16" fill="url(#cyan-glow)"/>
  <rect width="920" height="340" rx="16" fill="url(#purple-glow)"/>

  <!-- Top Header Section -->
  <circle cx="36" cy="35" r="6" fill="#38BDF8"/>
  <text x="52" y="40" class="hdr-title">ARCHITECTURAL CAPABILITIES &amp; ENGINEERING LANDSCAPE</text>

  <!-- 4 Pure Visual Dashboard Cards (2x2 Grid) -->

  <!-- Card 1: AI Agent Architecture (Top-Left: X: 30, Y: 60) -->
  <rect x="30" y="60" width="415" height="110" rx="10" fill="url(#card-glass)" stroke="url(#border-glow)" stroke-width="1.2"/>
  <circle cx="56" cy="90" r="14" fill="#8B5CF6" fill-opacity="0.2"/>
  <text x="50" y="95" font-family="sans-serif" font-size="14">🧠</text>
  <text x="80" y="88" class="card-hdr" fill="#8B5CF6">AI AGENT &amp; LLM ARCHITECTURE</text>
  <text x="80" y="106" class="card-desc">Autonomous multi-agent orchestration, RAG vector pipelines,</text>
  <text x="80" y="122" class="card-desc">and custom PyTorch / OpenAI model integration.</text>

  <!-- Visual Progress Meter 1 -->
  <rect x="80" y="136" width="340" height="8" rx="4" fill="#0F172A"/>
  <rect x="80" y="136" width="310" height="8" rx="4" fill="#8B5CF6"/>

  <!-- Card 2: Distributed Systems (Top-Right: X: 475, Y: 60) -->
  <rect x="475" y="60" width="415" height="110" rx="10" fill="url(#card-glass)" stroke="url(#border-glow)" stroke-width="1.2"/>
  <circle cx="501" cy="90" r="14" fill="#38BDF8" fill-opacity="0.2"/>
  <text x="495" y="95" font-family="sans-serif" font-size="14">⚡</text>
  <text x="525" y="88" class="card-hdr" fill="#38BDF8">HIGH-THROUGHPUT MICROSERVICES</text>
  <text x="525" y="106" class="card-desc">Event-driven backend services in Go &amp; Node.js designed</text>
  <text x="525" y="122" class="card-desc">for sub-50ms p99 latency targets and zero data loss.</text>

  <!-- Visual Progress Meter 2 -->
  <rect x="525" y="136" width="340" height="8" rx="4" fill="#0F172A"/>
  <rect x="525" y="136" width="325" height="8" rx="4" fill="#38BDF8"/>

  <!-- Card 3: Cloud Native Infra (Bottom-Left: X: 30, Y: 190) -->
  <rect x="30" y="190" width="415" height="110" rx="10" fill="url(#card-glass)" stroke="url(#border-glow)" stroke-width="1.2"/>
  <circle cx="56" cy="220" r="14" fill="#10B981" fill-opacity="0.2"/>
  <text x="50" y="225" font-family="sans-serif" font-size="14">☁️</text>
  <text x="80" y="218" class="card-hdr" fill="#10B981">CLOUD NATIVE INFRASTRUCTURE</text>
  <text x="80" y="236" class="card-desc">Kubernetes container orchestration, Docker automation,</text>
  <text x="80" y="252" class="card-desc">AWS IaC with Terraform, and self-healing telemetry.</text>

  <!-- Visual Progress Meter 3 -->
  <rect x="80" y="266" width="340" height="8" rx="4" fill="#0F172A"/>
  <rect x="80" y="266" width="295" height="8" rx="4" fill="#10B981"/>

  <!-- Card 4: Modern Web Experience (Bottom-Right: X: 475, Y: 190) -->
  <rect x="475" y="190" width="415" height="110" rx="10" fill="url(#card-glass)" stroke="url(#border-glow)" stroke-width="1.2"/>
  <circle cx="501" cy="220" r="14" fill="#60A5FA" fill-opacity="0.2"/>
  <text x="495" y="225" font-family="sans-serif" font-size="14">🎨</text>
  <text x="525" y="218" class="card-hdr" fill="#60A5FA">MODERN REACTIVE USER INTERFACES</text>
  <text x="525" y="236" class="card-desc">High-performance Next.js 15, React 19, &amp; Tailwind CSS</text>
  <text x="525" y="252" class="card-desc">fluid design systems with glassmorphic motion graphics.</text>

  <!-- Visual Progress Meter 4 -->
  <rect x="525" y="266" width="340" height="8" rx="4" fill="#0F172A"/>
  <rect x="525" y="266" width="330" height="8" rx="4" fill="#60A5FA"/>

  <!-- Outer Border -->
  <rect width="920" height="340" rx="16" fill="none" stroke="url(#border-glow)" stroke-width="1.5"/>
</svg>
