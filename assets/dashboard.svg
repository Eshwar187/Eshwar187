<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <linearGradient id="dash-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="dash-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="dash-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="dash-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@400;600;700;800&amp;display=swap');

      .dash-head {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 14px;
        fill: #FFFFFF;
        letter-spacing: 1.2px;
      }

      .dash-label {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        fill: #64748B;
        font-weight: 600;
      }

      .dash-val {
        font-family: 'Fira Code', monospace;
        font-size: 18px;
        font-weight: 700;
        fill: #38BDF8;
      }

      .lang-name {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #E2E8F0;
      }

      .lang-pct {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <rect width="920" height="260" rx="16" fill="url(#dash-bg)"/>

  <!-- Left Container: Core Developer Stats -->
  <g transform="translate(20, 20)">
    <rect width="440" height="220" rx="12" fill="url(#dash-card)" stroke="url(#dash-border)" stroke-width="1.2"/>

    <g transform="translate(20, 18)">
      <circle cx="6" cy="6" r="5" fill="#38BDF8" filter="url(#dash-glow)"/>
      <text x="20" y="10" class="dash-head">DEVELOPER METRICS &amp; IMPACT</text>

      <!-- Grid of Stats -->
      <!-- Row 1 -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="190" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="dash-label">TOTAL COMMITS</text>
        <text x="14" y="46" class="dash-val" fill="#38BDF8">1,840+</text>

        <rect x="205" y="0" width="195" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="dash-label">PULL REQUESTS</text>
        <text x="14" y="46" class="dash-val" fill="#8B5CF6">360+ Merged</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="190" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="dash-label">CODE REVIEWS</text>
        <text x="14" y="46" class="dash-val" fill="#10B981">520+ Done</text>

        <rect x="205" y="0" width="195" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="dash-label">GLOBAL CONTRIBUTIONS</text>
        <text x="14" y="46" class="dash-val" fill="#60A5FA">Top 1% Rank</text>
      </g>
    </g>
  </g>

  <!-- Right Container: Language Distribution -->
  <g transform="translate(480, 20)">
    <rect width="420" height="220" rx="12" fill="url(#dash-card)" stroke="url(#dash-border)" stroke-width="1.2"/>

    <g transform="translate(20, 18)">
      <circle cx="6" cy="6" r="5" fill="#8B5CF6" filter="url(#dash-glow)"/>
      <text x="20" y="10" class="dash-head">LANGUAGE DISTRIBUTION</text>

      <!-- Language Bars -->
      <g transform="translate(0, 32)">

        <!-- Multi-colored Bar Graphic -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="160" height="12" rx="6" fill="#3178C6"/>
          <rect x="164" y="0" width="105" height="12" rx="6" fill="#00ADD8"/>
          <rect x="273" y="0" width="65" height="12" rx="6" fill="#3572A5"/>
          <rect x="342" y="0" width="38" height="12" rx="6" fill="#CEA475"/>
        </g>

        <!-- Legend List -->
        <g transform="translate(0, 28)">
          <!-- TS -->
          <circle cx="6" cy="10" r="4" fill="#3178C6"/>
          <text x="16" y="14" class="lang-name">TypeScript</text>
          <text x="375" y="14" class="lang-pct" text-anchor="end">42%</text>

          <!-- Go -->
          <circle cx="6" cy="34" r="4" fill="#00ADD8"/>
          <text x="16" y="38" class="lang-name">Go (Golang)</text>
          <text x="375" y="38" class="lang-pct" text-anchor="end">28%</text>

          <!-- Python -->
          <circle cx="6" cy="58" r="4" fill="#3572A5"/>
          <text x="16" y="62" class="lang-name">Python</text>
          <text x="375" y="62" class="lang-pct" text-anchor="end">18%</text>

          <!-- Rust -->
          <circle cx="6" cy="82" r="4" fill="#CEA475"/>
          <text x="16" y="86" class="lang-name">Rust</text>
          <text x="375" y="86" class="lang-pct" text-anchor="end">8%</text>

          <!-- SQL / Other -->
          <circle cx="6" cy="106" r="4" fill="#10B981"/>
          <text x="16" y="110" class="lang-name">SQL &amp; Cloud Infra</text>
          <text x="375" y="110" class="lang-pct" text-anchor="end">4%</text>
        </g>

      </g>
    </g>
  </g>

  <rect width="920" height="260" rx="16" fill="none" stroke="url(#dash-border)" stroke-width="1.5"/>
</svg>
