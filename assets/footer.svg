<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B026FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="border-glow-ft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0.6"/>
    </linearGradient>

    <style>
      .ft-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }
      .ft-status {
        font-family: monospace, 'Courier New', Courier;
        font-weight: 700;
        font-size: 11px;
        fill: #10B981;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <rect width="920" height="120" rx="16" fill="url(#ft-bg)"/>

  <!-- Wave Vector 1 -->
  <path d="M 0,60 Q 230,20 460,60 T 920,60" fill="none" stroke="url(#wave-grad-1)" stroke-width="2"/>
  <!-- Wave Vector 2 -->
  <path d="M 0,60 Q 230,100 460,60 T 920,60" fill="none" stroke="url(#wave-grad-2)" stroke-width="2"/>

  <!-- Status Indicator Node -->
  <circle cx="460" cy="45" r="5" fill="#10B981"/>
  <text x="460" y="68" class="ft-status" text-anchor="middle">SYSTEM OPERATIONAL • ALL SERVICES ONLINE</text>

  <!-- Copyright / Brand -->
  <text x="460" y="94" class="ft-txt" text-anchor="middle">ESHWAR J  |  FULL STACK &amp; AI ARCHITECT</text>

  <!-- Outer Glow Frame -->
  <rect width="920" height="120" rx="16" fill="none" stroke="url(#border-glow-ft)" stroke-width="1.5"/>
</svg>
