<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 16" width="100%" height="100%">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="20%" stop-color="#2563EB" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Line -->
  <line x1="40" y1="8" x2="880" y2="8" stroke="url(#divider-grad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Center Diamond Accent -->
  <polygon points="460,3 465,8 460,13 455,8" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="460" cy="8" r="8" fill="url(#center-glow)"/>
</svg>
