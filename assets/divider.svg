<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 24" width="100%" height="100%">
  <defs>
    <linearGradient id="div-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#B026FF" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Laser Line -->
  <line x1="40" y1="12" x2="880" y2="12" stroke="url(#div-glow)" stroke-width="2" filter="url(#blur-glow)"/>

  <!-- Center Diamond Node -->
  <g transform="translate(460, 12)">
    <circle cx="0" cy="0" r="10" fill="url(#node-glow)" opacity="0.6"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#00F0FF"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
</svg>
