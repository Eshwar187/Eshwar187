<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <linearGradient id="tm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="tm-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="tm-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;family=Inter:wght@400;600;700;800&amp;display=swap');

      .cat-title {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #38BDF8;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .tech-pill {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <rect width="920" height="280" rx="16" fill="url(#tm-bg)"/>

  <!-- 3x2 Category Grid -->

  <!-- Cat 1: Languages -->
  <g transform="translate(20, 20)">
    <rect width="280" height="110" rx="10" fill="url(#tm-card)" stroke="url(#tm-border)" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text x="0" y="12" class="cat-title">💻 Core Languages</text>
      
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#3178C6" stroke-width="1"/>
        <text x="10" y="16" class="tech-pill" fill="#60A5FA">TypeScript</text>

        <rect x="125" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
        <text x="135" y="16" class="tech-pill" fill="#38BDF8">Go (Golang)</text>

        <rect x="0" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#3572A5" stroke-width="1"/>
        <text x="10" y="48" class="tech-pill" fill="#93C5FD">Python</text>

        <rect x="125" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#F97316" stroke-width="1"/>
        <text x="135" y="48" class="tech-pill" fill="#FB923C">Rust</text>
      </g>
    </g>
  </g>

  <!-- Cat 2: Frontend & UI -->
  <g transform="translate(320, 20)">
    <rect width="280" height="110" rx="10" fill="url(#tm-card)" stroke="url(#tm-border)" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text x="0" y="12" class="cat-title">🎨 Frontend &amp; UI</text>

      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#FFFFFF" stroke-width="0.8"/>
        <text x="10" y="16" class="tech-pill" fill="#FFFFFF">Next.js 14/15</text>

        <rect x="125" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#61DAFB" stroke-width="1"/>
        <text x="135" y="16" class="tech-pill" fill="#61DAFB">React 19</text>

        <rect x="0" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
        <text x="10" y="48" class="tech-pill" fill="#22D3EE">Tailwind v4</text>

        <rect x="125" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
        <text x="135" y="48" class="tech-pill" fill="#A78BFA">Framer Motion</text>
      </g>
    </g>
  </g>

  <!-- Cat 3: Backend & Systems -->
  <g transform="translate(620, 20)">
    <rect width="280" height="110" rx="10" fill="url(#tm-card)" stroke="url(#tm-border)" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text x="0" y="12" class="cat-title">⚙️ Backend &amp; APIs</text>

      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#5FA04E" stroke-width="1"/>
        <text x="10" y="16" class="tech-pill" fill="#4ADE80">Node.js / Bun</text>

        <rect x="125" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#E535AB" stroke-width="1"/>
        <text x="135" y="16" class="tech-pill" fill="#F472B6">GraphQL / gRPC</text>

        <rect x="0" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#009688" stroke-width="1"/>
        <text x="10" y="48" class="tech-pill" fill="#2DD4BF">FastAPI</text>

        <rect x="125" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#2563EB" stroke-width="1"/>
        <text x="135" y="48" class="tech-pill" fill="#60A5FA">Kafka / NATS</text>
      </g>
    </g>
  </g>

  <!-- Cat 4: AI & Machine Learning -->
  <g transform="translate(20, 150)">
    <rect width="280" height="110" rx="10" fill="url(#tm-card)" stroke="url(#tm-border)" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text x="0" y="12" class="cat-title" fill="#8B5CF6">🧠 AI &amp; Machine Learning</text>

      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#EE4C2C" stroke-width="1"/>
        <text x="10" y="16" class="tech-pill" fill="#F87171">PyTorch</text>

        <rect x="125" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
        <text x="135" y="16" class="tech-pill" fill="#34D399">OpenAI / Claude</text>

        <rect x="0" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
        <text x="10" y="48" class="tech-pill" fill="#C084FC">LangChain / RAG</text>

        <rect x="125" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
        <text x="135" y="48" class="tech-pill" fill="#38BDF8">Pinecone / Qdrant</text>
      </g>
    </g>
  </g>

  <!-- Cat 5: Cloud & Infrastructure -->
  <g transform="translate(320, 150)">
    <rect width="280" height="110" rx="10" fill="url(#tm-card)" stroke="url(#tm-border)" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text x="0" y="12" class="cat-title" fill="#38BDF8">☁️ Cloud &amp; DevOps</text>

      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#FF9900" stroke-width="1"/>
        <text x="10" y="16" class="tech-pill" fill="#FBBF24">AWS Cloud</text>

        <rect x="125" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#2496ED" stroke-width="1"/>
        <text x="135" y="16" class="tech-pill" fill="#60A5FA">Docker Engine</text>

        <rect x="0" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#326CE5" stroke-width="1"/>
        <text x="10" y="48" class="tech-pill" fill="#93C5FD">Kubernetes</text>

        <rect x="125" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#844FBA" stroke-width="1"/>
        <text x="135" y="48" class="tech-pill" fill="#C084FC">Terraform / IaC</text>
      </g>
    </g>
  </g>

  <!-- Cat 6: Databases & Storage -->
  <g transform="translate(620, 150)">
    <rect width="280" height="110" rx="10" fill="url(#tm-card)" stroke="url(#tm-border)" stroke-width="1"/>
    <g transform="translate(16, 16)">
      <text x="0" y="12" class="cat-title" fill="#10B981">🗄️ Databases &amp; Storage</text>

      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#336791" stroke-width="1"/>
        <text x="10" y="16" class="tech-pill" fill="#60A5FA">PostgreSQL</text>

        <rect x="125" y="0" width="115" height="24" rx="6" fill="#0F172A" stroke="#DC2626" stroke-width="1"/>
        <text x="135" y="16" class="tech-pill" fill="#F87171">Redis Cluster</text>

        <rect x="0" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#47A248" stroke-width="1"/>
        <text x="10" y="48" class="tech-pill" fill="#4ADE80">MongoDB</text>

        <rect x="125" y="32" width="115" height="24" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
        <text x="135" y="48" class="tech-pill" fill="#FBBF24">ClickHouse</text>
      </g>
    </g>
  </g>

  <rect width="920" height="280" rx="16" fill="none" stroke="url(#tm-border)" stroke-width="1.5"/>
</svg>
