<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <linearGradient id="tm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="tm-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="border-glow-tm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#B026FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3"/>
    </linearGradient>

    <style>
      .hdr-main {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 13px;
        fill: #FFFFFF;
        letter-spacing: 1.5px;
      }
      .col-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 1px;
      }
      .tech-item {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        fill: #E2E8F0;
        font-weight: 600;
      }
      .tech-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 9px;
        fill: #64748B;
      }
    </style>
  </defs>

  <!-- Base Container -->
  <rect width="920" height="280" rx="16" fill="url(#tm-bg)"/>

  <!-- Top Title Bar -->
  <circle cx="30" cy="25" r="4" fill="#B026FF"/>
  <text x="44" y="29" class="hdr-main">TECHNOLOGY MATRIX &amp; PRODUCTION STACK</text>

  <!-- 4 Columns Grid -->

  <!-- Column 1: CORE LANGUAGES (X: 20) -->
  <rect x="20" y="45" width="205" height="215" rx="10" fill="url(#tm-glass)" stroke="url(#border-glow-tm)" stroke-width="1"/>
  <text x="35" y="70" class="col-title" fill="#00F0FF">&lt;/&gt; LANGUAGES</text>

  <!-- Item 1: TypeScript -->
  <text x="35" y="96" class="tech-item">TypeScript</text>
  <text x="175" y="96" class="tech-sub" text-anchor="end">23 Repos</text>
  <rect x="35" y="104" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="35" y="104" width="135" height="4" rx="2" fill="#00F0FF"/>

  <!-- Item 2: JavaScript -->
  <text x="35" y="132" class="tech-item">JavaScript</text>
  <text x="175" y="132" class="tech-sub" text-anchor="end">23 Repos</text>
  <rect x="35" y="140" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="35" y="140" width="135" height="4" rx="2" fill="#F7DF1E"/>

  <!-- Item 3: Python -->
  <text x="35" y="168" class="tech-item">Python</text>
  <text x="175" y="168" class="tech-sub" text-anchor="end">7 Repos</text>
  <rect x="35" y="176" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="35" y="176" width="95" height="4" rx="2" fill="#3776AB"/>

  <!-- Item 4: C / Systems -->
  <text x="35" y="204" class="tech-item">C / Systems</text>
  <text x="175" y="204" class="tech-sub" text-anchor="end">5 Repos</text>
  <rect x="35" y="212" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="35" y="212" width="75" height="4" rx="2" fill="#A8B9CC"/>

  <!-- Column 2: CLOUD & INFRA (X: 242) -->
  <rect x="242" y="45" width="205" height="215" rx="10" fill="url(#tm-glass)" stroke="url(#border-glow-tm)" stroke-width="1"/>
  <text x="257" y="70" class="col-title" fill="#B026FF">☁️ CLOUD &amp; INFRA</text>

  <text x="257" y="96" class="tech-item">Docker Automation</text>
  <rect x="257" y="104" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="257" y="104" width="140" height="4" rx="2" fill="#B026FF"/>

  <text x="257" y="132" class="tech-item">Kubernetes (K8s)</text>
  <rect x="257" y="140" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="257" y="140" width="125" height="4" rx="2" fill="#38BDF8"/>

  <text x="257" y="168" class="tech-item">AWS Cloud Infra</text>
  <rect x="257" y="176" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="257" y="176" width="130" height="4" rx="2" fill="#FF9900"/>

  <text x="257" y="204" class="tech-item">GitHub Actions CI/CD</text>
  <rect x="257" y="212" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="257" y="212" width="145" height="4" rx="2" fill="#2088FF"/>

  <!-- Column 3: AI & MACHINE LEARNING (X: 464) -->
  <rect x="464" y="45" width="205" height="215" rx="10" fill="url(#tm-glass)" stroke="url(#border-glow-tm)" stroke-width="1"/>
  <text x="479" y="70" class="col-title" fill="#10B981">🧠 AI &amp; INTELLIGENCE</text>

  <text x="479" y="96" class="tech-item">Multi-Agent LLMs</text>
  <rect x="479" y="104" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="479" y="104" width="140" height="4" rx="2" fill="#10B981"/>

  <text x="479" y="132" class="tech-item">RAG &amp; Vector DBs</text>
  <rect x="479" y="140" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="479" y="140" width="130" height="4" rx="2" fill="#34D399"/>

  <text x="479" y="168" class="tech-item">PyTorch Models</text>
  <rect x="479" y="176" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="479" y="176" width="115" height="4" rx="2" fill="#EE4C2C"/>

  <text x="479" y="204" class="tech-item">OpenAI / Gemini APIs</text>
  <rect x="479" y="212" width="145" height="4" rx="2" fill="#0F172A"/>
  <rect x="479" y="212" width="145" height="4" rx="2" fill="#10A37F"/>

  <!-- Column 4: WEB & DATABASES (X: 686) -->
  <rect x="686" y="45" width="214" height="215" rx="10" fill="url(#tm-glass)" stroke="url(#border-glow-tm)" stroke-width="1"/>
  <text x="701" y="70" class="col-title" fill="#60A5FA">🗄️ WEB &amp; DATA</text>

  <text x="701" y="96" class="tech-item">Next.js 15 &amp; React 19</text>
  <rect x="701" y="104" width="154" height="4" rx="2" fill="#0F172A"/>
  <rect x="701" y="104" width="150" height="4" rx="2" fill="#60A5FA"/>

  <text x="701" y="132" class="tech-item">PostgreSQL &amp; Prisma</text>
  <rect x="701" y="140" width="154" height="4" rx="2" fill="#0F172A"/>
  <rect x="701" y="140" width="140" height="4" rx="2" fill="#4169E1"/>

  <text x="701" y="168" class="tech-item">Node.js Microservices</text>
  <rect x="701" y="176" width="154" height="4" rx="2" fill="#0F172A"/>
  <rect x="701" y="176" width="145" height="4" rx="2" fill="#5FA04E"/>

  <text x="701" y="204" class="tech-item">Tailwind v4 / GraphQL</text>
  <rect x="701" y="212" width="154" height="4" rx="2" fill="#0F172A"/>
  <rect x="701" y="212" width="135" height="4" rx="2" fill="#38BDF8"/>

  <!-- Outer Frame -->
  <rect width="920" height="280" rx="16" fill="none" stroke="url(#border-glow-tm)" stroke-width="1.5"/>
</svg>
