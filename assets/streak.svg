<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 140" width="100%" height="100%">
  <defs>
    <linearGradient id="stk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="stk-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="stk-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;family=Inter:wght@400;600;700;800&amp;display=swap');

      .stk-title {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #64748B;
        letter-spacing: 1px;
      }

      .stk-val {
        font-family: 'Fira Code', monospace;
        font-size: 24px;
        font-weight: 700;
      }

      .stk-sub {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <rect width="920" height="140" rx="16" fill="url(#stk-bg)"/>

  <!-- 3 Equal Width Stat Blocks -->
  <g transform="translate(20, 20)">

    <!-- Block 1: Total Contributions -->
    <g transform="translate(0, 0)">
      <rect width="280" height="100" rx="10" fill="url(#stk-card)" stroke="url(#stk-border)" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <text x="0" y="12" class="stk-title">TOTAL CONTRIBUTIONS</text>
        <text x="0" y="44" class="stk-val" fill="#38BDF8">2,480+</text>
        <text x="0" y="64" class="stk-sub">Year to Date Active Coding</text>
      </g>
    </g>

    <!-- Block 2: Current Streak -->
    <g transform="translate(300, 0)">
      <rect width="280" height="100" rx="10" fill="url(#stk-card)" stroke="url(#stk-border)" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <text x="0" y="12" class="stk-title">CURRENT STREAK</text>
        <text x="0" y="44" class="stk-val" fill="#8B5CF6">64 Days 🔥</text>
        <text x="0" y="64" class="stk-sub">Consistent Daily Commits</text>
      </g>
    </g>

    <!-- Block 3: Longest Streak -->
    <g transform="translate(600, 0)">
      <rect width="280" height="100" rx="10" fill="url(#stk-card)" stroke="url(#stk-border)" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <text x="0" y="12" class="stk-title">LONGEST STREAK</text>
        <text x="0" y="44" class="stk-val" fill="#10B981">142 Days ⚡</text>
        <text x="0" y="64" class="stk-sub">All-Time Peak Velocity</text>
      </g>
    </g>

  </g>

  <rect width="920" height="140" rx="16" fill="none" stroke="url(#stk-border)" stroke-width="1.5"/>
</svg>
