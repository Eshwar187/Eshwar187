<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6"/>
    </linearGradient>
    <style>
      .hdr { font-family: -apple-system, sans-serif; font-weight: 800; font-size: 13px; fill: #10B981; letter-spacing: 1px; }
      .lbl { font-family: -apple-system, sans-serif; font-size: 10px; fill: #64748B; font-weight: 700; text-transform: uppercase; }
      .val { font-family: -apple-system, sans-serif; font-size: 18px; fill: #F8FAFC; font-weight: 800; }
    </style>
  </defs>

  <rect width="450" height="200" rx="12" fill="url(#card-bg)" stroke="url(#border-glow)" stroke-width="1.2"/>

  <!-- Title -->
  <circle cx="25" cy="25" r="4" fill="#10B981"/>
  <text x="36" y="29" class="hdr">REAL GITHUB METRICS — @eshwar187</text>

  <!-- Box 1: Public Repositories (REAL 120 REPOS) -->
  <rect x="20" y="45" width="195" height="65" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="32" y="63" class="lbl">TOTAL PUBLIC REPOS</text>
  <text x="32" y="90" class="val" fill="#10B981">120 Repos</text>

  <!-- Box 2: Top Languages -->
  <rect x="235" y="45" width="195" height="65" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="247" y="63" class="lbl">PRIMARY LANGUAGES</text>
  <text x="247" y="90" class="val" fill="#38BDF8">TS &amp; JS (56%)</text>

  <!-- Box 3: Account Status -->
  <rect x="20" y="120" width="195" height="65" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="32" y="138" class="lbl">ACCOUNT CREATED</text>
  <text x="32" y="165" class="val" fill="#8B5CF6">May 2023</text>

  <!-- Box 4: Automated Sync -->
  <rect x="235" y="120" width="195" height="65" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="247" y="138" class="lbl">AUTOMATED SYNC</text>
  <text x="247" y="165" class="val" fill="#60A5FA">GitHub Actions</text>
</svg>
