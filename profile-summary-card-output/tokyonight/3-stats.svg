<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 13px;
        fill: #10B981;
        letter-spacing: 1px;
      }
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        fill: #64748B;
        font-weight: 600;
      }
      .val {
        font-family: monospace, 'Courier New', Courier;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="440" height="220" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.2"/>

  <!-- Header (Absolute Coordinates) -->
  <circle cx="26" cy="28" r="5" fill="#10B981"/>
  <text x="40" y="32" class="title">COMMIT STREAKS &amp; ACTIVITY METRICS</text>

  <!-- Grid Stats (Absolute X and Y for every box) -->

  <!-- Box 1: Top Left (Absolute X: 20, Y: 52) -->
  <rect x="20" y="52" width="190" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="34" y="74" class="label">CURRENT STREAK</text>
  <text x="34" y="96" class="val" fill="#38BDF8">14 Days 🔥</text>

  <!-- Box 2: Top Right (Absolute X: 225, Y: 52) -->
  <rect x="225" y="52" width="195" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="239" y="74" class="label">LONGEST STREAK</text>
  <text x="239" y="96" class="val" fill="#8B5CF6">42 Days ⚡</text>

  <!-- Box 3: Bottom Left (Absolute X: 20, Y: 127) -->
  <rect x="20" y="127" width="190" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="34" y="149" class="label">TOTAL COMMITS</text>
  <text x="34" y="171" class="val" fill="#10B981">850+ Commits</text>

  <!-- Box 4: Bottom Right (Absolute X: 225, Y: 127) -->
  <rect x="225" y="127" width="195" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="239" y="149" class="label">ACTIVITY MATRIX</text>
  <text x="239" y="171" class="val" fill="#60A5FA">Active Daily</text>

</svg>
