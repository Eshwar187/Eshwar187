<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="subtle-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 13px;
        fill: #38BDF8;
        letter-spacing: 1px;
      }
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        fill: #64748B;
        font-weight: 600;
      }
      .val {
        font-family: monospace, 'Courier New', Courier;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect width="440" height="220" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.2"/>

  <g transform="translate(20, 22)">
    <!-- Header -->
    <circle cx="6" cy="6" r="5" fill="#38BDF8" filter="url(#subtle-glow)"/>
    <text x="20" y="10" class="title">GITHUB PROFILE DETAILS — @eshwar187</text>

    <!-- Grid Stats with isolated g transform groups -->
    <g transform="translate(0, 30)">
      
      <!-- Box 1: Top Left -->
      <g transform="translate(0, 0)">
        <rect width="190" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="label">REPOSITORIES</text>
        <text x="14" y="44" class="val" fill="#38BDF8">Public Profile</text>
      </g>

      <!-- Box 2: Top Right -->
      <g transform="translate(205, 0)">
        <rect width="195" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="label">CONTRIBUTIONS</text>
        <text x="14" y="44" class="val" fill="#8B5CF6">Active Developer</text>
      </g>

      <!-- Box 3: Bottom Left -->
      <g transform="translate(0, 75)">
        <rect width="190" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="label">ACCOUNT STATUS</text>
        <text x="14" y="44" class="val" fill="#10B981">Verified GitHub</text>
      </g>

      <!-- Box 4: Bottom Right -->
      <g transform="translate(205, 75)">
        <rect width="195" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="label">AUTOMATED SYNC</text>
        <text x="14" y="44" class="val" fill="#60A5FA">GitHub Actions</text>
      </g>

    </g>
  </g>
</svg>
