<svg xmlns="http://www.w3.org/2000/svg" width="450" height="200" viewBox="0 0 450 200">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>
    <style>
      .hdr { font-family: -apple-system, sans-serif; font-weight: 800; font-size: 13px; fill: #38BDF8; letter-spacing: 1px; }
      .lbl { font-family: -apple-system, sans-serif; font-size: 11px; fill: #94A3B8; font-weight: 600; }
      .pct { font-family: -apple-system, sans-serif; font-size: 11px; fill: #F8FAFC; font-weight: 700; }
    </style>
  </defs>

  <rect width="450" height="200" rx="12" fill="url(#card-bg)" stroke="url(#border-glow)" stroke-width="1.2"/>

  <!-- Title -->
  <circle cx="25" cy="25" r="4" fill="#38BDF8"/>
  <text x="36" y="29" class="hdr">MOST COMMITTED LANGUAGES — @eshwar187</text>

  <!-- Progress Bar Breakdown -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="115" height="12" rx="4" fill="#3178C6"/> <!-- TypeScript -->
    <rect x="118" y="0" width="115" height="12" rx="4" fill="#F7DF1E"/> <!-- JavaScript -->
    <rect x="236" y="0" width="90" height="12" rx="4" fill="#E34F26"/> <!-- HTML -->
    <rect x="329" y="0" width="45" height="12" rx="4" fill="#3776AB"/> <!-- Python -->
    <rect x="377" y="0" width="33" height="12" rx="4" fill="#A8B9CC"/> <!-- C -->
  </g>

  <!-- Legend Items (Real Data) -->
  <g transform="translate(25, 80)">
    <circle cx="6" cy="10" r="5" fill="#3178C6"/>
    <text x="20" y="14" class="lbl">TypeScript</text>
    <text x="360" y="14" class="pct">28%</text>

    <circle cx="6" cy="32" r="5" fill="#F7DF1E"/>
    <text x="20" y="36" class="lbl">JavaScript</text>
    <text x="360" y="36" class="pct">28%</text>

    <circle cx="6" cy="54" r="5" fill="#E34F26"/>
    <text x="20" y="58" class="lbl">HTML / Web UI</text>
    <text x="360" y="58" class="pct">22%</text>

    <circle cx="6" cy="76" r="5" fill="#3776AB"/>
    <text x="20" y="80" class="lbl">Python / AI</text>
    <text x="360" y="80" class="pct">9%</text>

    <circle cx="6" cy="98" r="5" fill="#A8B9CC"/>
    <text x="20" y="102" class="lbl">C / Systems</text>
    <text x="360" y="102" class="pct">6%</text>
  </g>
</svg>
